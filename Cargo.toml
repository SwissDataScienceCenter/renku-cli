[package]
name = "rnk"
description = "A command line interface to the Renku platform"
homepage = "https://renkulab.io/"
edition = "2024"
resolver = "3"
license = "Apache-2.0"
repository = "https://github.com/SwissDatascienceCenter/renku-cli"
keywords = ["renku", "cli"]
categories = ["command-line-utilities"]
build = "build.rs"

# See more keys and their definitions at
# https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
console = { version = "0.16.4" }
env_logger = { version = "0.11.11" }
log = { version = "0.4.34" }
openssl = { version = "0.10.81", optional = true }
rand = { version = "0.10" }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  "stream",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
snafu = { version = "0.9.2" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
walkdir = "2"
tabled = "0.21.0"
chrono = "0.4.45"
futures = { version = "0.3" }
regex = { version = "1.13.1" }
regex-macro = { version = "0.3.0" }
iso8601-timestamp = { version = "0.4" }
toml = { version = "1.1.5" }
git2 = { version = "0.21.0", default-features = false, features = [
  "vendored-libgit2",
  "https",
  "ssh",
] }
url = { version = "2.5.8" }
openidconnect = { version = "4.0.1", default-features = false, features = [
  "reqwest",
] }
directories = { version = "6.0" }
comrak = { version = "0.28.0", optional = true }
clap-verbosity-flag = "3.0.4"
color-eyre = "0.6.5"
better-panic = "0.3.0"
human-panic = "2.0.8"
libc = "0.2.189"
self_update = { version = "1.3.0", features = [
  "archive-tar",
  "archive-zip",
  "compression-tar-gz",
] }
md5 = "0.8.1"
ulid = "3.0.0"
keyring-core = { version = "1.0.0", features = ["sample"] }
whoami = "2.1.3"
open = "5.4.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
db-keystore = { version = "0.5.2" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { version = "1.0.0" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }



[features]
default = ["reqwest/default-tls"] # link against system library
rustls = [
  "reqwest/rustls-tls",
  "openidconnect/rustls-tls",
  "self_update/rustls",
] # include rustls, ssl library written in rust
vendored-openssl = [
  "openssl/vendored",
  "reqwest/native-tls-vendored",
] # include compiled openssl library
vendored-zlib = [
  "git2/zlib-ng-compat",
] # without this feature wherever the cli is installed needs to have zlib.so
user-doc = ["dep:comrak"]

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[build-dependencies]
vergen-gix = { version = "10.0.3", features = [
  "build",
  "cargo",
  "rustc",
] }

[profile.release]
strip = "debuginfo"
opt-level = "z"
lto = true
